spring.application.name=rabbitmq
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.exchange.name=myExchange
rabbitmq.queue.string.name=myQueue-string
rabbitmq.routing.string.key=myRoutingKey-string

rabbitmq.queue.json.name=myQueue-json
rabbitmq.routing.json.key=myRoutingKey-json